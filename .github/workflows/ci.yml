# Code scanning false positive ignore: SonarQube Docs API Key
# The following SHA references are not secrets, but workflow version pins for tf-sonar.yml reusable workflow.


  name: CI

  on:
    pull_request:
      types: [opened, synchronize, reopened, ready_for_review]
      branches: [main]

  concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    ci-local-coverage:
      permissions:
        contents: read
      uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-ci-local-coverage.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
      with:
        mode: defines
        enforce: true
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'

    check-workflow-syntax:
      if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
      timeout-minutes: 15
      permissions:
        contents: read
      runs-on: ubuntu-latest
      steps:
        - name: Check workflow syntax
          run: echo "Workflow syntax is valid"
    general-workflows-policy:
      permissions:
        contents: read
      uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-workflows-policy.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
      with:
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    codeql-actions:
      permissions:
        contents: read
        actions: read
        security-events: write
      uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
      with:
        languages: actions
        source-root: .
        upload-sarif: false
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    fmt:
      permissions:
        contents: read
      uses: ./.github/workflows/tf-fmt.yml
      with:
        working-directory: examples/hello
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    validate:
      permissions:
        contents: read
      uses: ./.github/workflows/tf-validate.yml
      with:
        chdir: examples/hello/stack
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    lint:
      permissions:
        contents: read
      uses: ./.github/workflows/tf-lint.yml
      with:
        lint-path: examples/hello
        tflint-config: examples/hello/.tflint.hcl
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    docs:
      permissions:
        contents: read
      uses: ./.github/workflows/tf-docs.yml
      with:
        working-directory: examples/hello
        output-file: README.md
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    security:
      permissions:
        contents: read
        actions: read
        security-events: write
      uses: ./.github/workflows/tf-security.yml
      with:
        scan-ref: examples/hello
        upload-sarif: false
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    tfsec:
      permissions:
        contents: read
      uses: ./.github/workflows/tf-tfsec.yml
      with:
        scan-path: examples/hello
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    checkov:
      permissions:
        contents: read
      uses: ./.github/workflows/tf-checkov.yml
      with:
        scan-directory: examples/hello
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    test-tidy:
      permissions:
        contents: read
      uses: ./.github/workflows/tf-test-tidy.yml
      with:
        test-dir: examples/hello/test
        go-version: "1.25.8"
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    semgrep:
      permissions:
        contents: read
      uses: ./.github/workflows/tf-semgrep.yml
      with:
        working-directory: examples/hello
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    # code scanning false positive ignore: SonarQube Docs API Key
    # The following SHA reference is not a secret, but a workflow version pin for tf-sonar.yml reusable workflow.
    sonar:
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
      permissions:
        contents: read
      uses: ./.github/workflows/tf-sonar.yml
      with:
        working-directory: examples/hello
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
      secrets:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    plan-dry-run:
      permissions:
        contents: read
        id-token: write
        pull-requests: write
      uses: ./.github/workflows/tf-plan.yml
      with:
        environment: dev
        chdir: examples/hello/stack
        dry-run: true
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    drift-dry-run:
      permissions:
        contents: read
        id-token: write
      uses: ./.github/workflows/tf-drift.yml
      with:
        environment: dev
        chdir: examples/hello/stack
        dry-run: true
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    apply-dry-run:
      permissions:
        contents: read
        id-token: write
      uses: ./.github/workflows/tf-apply.yml
      with:
        environment: dev
        chdir: examples/hello/stack
        dry-run: true
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    destroy-dry-run:
      permissions:
        contents: read
        id-token: write
      uses: ./.github/workflows/tf-destroy.yml
      with:
        environment: dev
        chdir: examples/hello/stack
        dry-run: true
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
    cost-dry-run:
      permissions:
        contents: read
        id-token: write
        pull-requests: write
      uses: ./.github/workflows/tf-cost.yml
      with:
        path: examples/hello/stack
        dry-run: true
        # public repo: self-hosted runners are structurally unavailable here
        runner: '["ubuntu-latest"]'
