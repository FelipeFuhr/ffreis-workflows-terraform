name: Terraform Compliance Scan (Checkov)

on:
  workflow_call:
    inputs:
      scan-directory:
        description: "Directory to scan"
        type: string
        default: "."
      framework:
        description: "Checkov framework to use"
        type: string
        default: "terraform"
      soft-fail:
        description: "Exit 0 even if checks fail (soft-fail mode)"
        type: boolean
        default: false
      skip-check:
        description: "Comma-separated check IDs to skip, e.g. CKV_AWS_1,CKV_AWS_2"
        type: string
        default: ""
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

jobs:
  checkov:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 15
    name: Compliance scan (checkov)
    permissions:
      contents: read
    runs-on: ${{ fromJson(inputs.runner) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      # Pin the interpreter. Without this the job inherits the runner's default
      # Python, which drifted to 3.13 on ubuntu-latest and broke the install
      # outright:
      #
      #   ERROR: Could not find a version that satisfies the requirement
      #          rustworkx<0.14.0,>=0.13.0 (from checkov)
      #          (from versions: 0.15.0, 0.15.1, 0.16.0, ...)
      #
      # checkov 3.2.0 pins rustworkx<0.14.0, and rustworkx 0.13.x publishes
      # wheels for cp37-cp312 only — there is no cp313 wheel, and
      # --only-binary=:all: (correctly) refuses to build from source. So every
      # consumer running on ubuntu-latest fails at pip, before scanning
      # anything, and reports zero findings while looking like a policy failure.
      #
      # Pinning Python rather than bumping CHECKOV_VERSION is deliberate:
      # 3.2.0 -> 3.2.533 (the oldest release that relaxes the constraint to
      # rustworkx<1.0.0) is 533 patch releases of new and changed checks, which
      # would turn currently-green consumers red for reasons unrelated to this
      # breakage. This keeps the scan identical and only fixes the install.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Checkov
        env:
          # scan-fix(scorecard:PinnedDependenciesID): hash-verified wheel download before install
          CHECKOV_VERSION: "3.2.0"
          CHECKOV_SHA256: "2719334876d0ee6a8ebe8d15ff393cbb4c13dcfe81e3cb9348ef2c1ed8372c6e"
        run: |
          set -euo pipefail
          pip download --only-binary=:all: --no-deps \
            "checkov==${CHECKOV_VERSION}" -d /tmp/checkov-wheel
          echo "${CHECKOV_SHA256}  /tmp/checkov-wheel/checkov-${CHECKOV_VERSION}-py3-none-any.whl" \
            | sha256sum -c
          # scan-fix(shellcheck:SC2086): quoted the wheel path — word-splitting/globbing on ${CHECKOV_VERSION}
          pip install --only-binary=:all: "/tmp/checkov-wheel/checkov-${CHECKOV_VERSION}-py3-none-any.whl"

      - name: Run Checkov (with soft-fail, with skip-check)
        if: ${{ inputs.soft-fail && inputs.skip-check != '' }}
        env:
          SCAN_DIRECTORY: ${{ inputs.scan-directory }}
          FRAMEWORK: ${{ inputs.framework }}
          SKIP_CHECK: ${{ inputs.skip-check }}
        run: |
          set -euo pipefail
          checkov \
            -d "$SCAN_DIRECTORY" \
            --framework "$FRAMEWORK" \
            --skip-check "$SKIP_CHECK" \
            --soft-fail \
            --quiet \
            --compact

      - name: Run Checkov (with soft-fail, no skip-check)
        if: ${{ inputs.soft-fail && inputs.skip-check == '' }}
        env:
          SCAN_DIRECTORY: ${{ inputs.scan-directory }}
          FRAMEWORK: ${{ inputs.framework }}
        run: |
          set -euo pipefail
          checkov \
            -d "$SCAN_DIRECTORY" \
            --framework "$FRAMEWORK" \
            --soft-fail \
            --quiet \
            --compact

      - name: Run Checkov (hard-fail, with skip-check)
        if: ${{ !inputs.soft-fail && inputs.skip-check != '' }}
        env:
          SCAN_DIRECTORY: ${{ inputs.scan-directory }}
          FRAMEWORK: ${{ inputs.framework }}
          SKIP_CHECK: ${{ inputs.skip-check }}
        run: |
          set -euo pipefail
          checkov \
            -d "$SCAN_DIRECTORY" \
            --framework "$FRAMEWORK" \
            --skip-check "$SKIP_CHECK" \
            --quiet \
            --compact

      - name: Run Checkov (hard-fail, no skip-check)
        if: ${{ !inputs.soft-fail && inputs.skip-check == '' }}
        env:
          SCAN_DIRECTORY: ${{ inputs.scan-directory }}
          FRAMEWORK: ${{ inputs.framework }}
        run: |
          set -euo pipefail
          checkov \
            -d "$SCAN_DIRECTORY" \
            --framework "$FRAMEWORK" \
            --quiet \
            --compact
