name: Terraform SonarCloud

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing the Terraform configuration to scan"
        type: string
        default: "."
      sonar-project-key:
        description: "SonarCloud project key (defaults to sonar-project.properties or owner_repo)"
        type: string
        default: ""
      sonar-organization:
        description: "SonarCloud organization slug (defaults to sonar-project.properties or repository owner)"
        type: string
        default: ""
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'
    secrets:
      SONAR_TOKEN:
        required: true
      CI_NOTIFY_ROLE_ARN:
        description: "IAM role ARN for the fleet's monitor-Lambda CI-fallback notification (optional; omit to disable notification entirely — no AWS call is made)."
        required: false

jobs:
  sonar:
    timeout-minutes: 30
    name: SonarCloud
    permissions:
      contents: read
    runs-on: ${{ fromJson(inputs.runner) }}
    if: vars.SONAR_ENABLED != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - name: Resolve Sonar settings
        # project-key/organization resolution is intentionally unchanged from
        # before this job routed through the shared sonar-scan-with-fallback
        # composite: sonar-project.properties > repo var > input > computed
        # default. Getting a SonarCloud project key wrong creates a brand-new
        # project and loses analysis history, so this logic stays put — only
        # the local/SonarCloud routing and the actual scan steps moved into
        # the composite.
        id: vars
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          INPUT_PROJECT_KEY: ${{ inputs.sonar-project-key }}
          INPUT_ORG: ${{ inputs.sonar-organization }}
          VAR_ORG: ${{ vars.SONAR_ORGANIZATION }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          project_key="$INPUT_PROJECT_KEY"
          organization="$INPUT_ORG"

          props="${WORKING_DIRECTORY%/}/sonar-project.properties"
          if [[ -f "$props" ]]; then
            if [[ -z "$project_key" ]]; then
              project_key="$(sed -n 's/^[[:space:]]*sonar\\.projectKey[[:space:]]*=[[:space:]]*//p' "$props" | head -n 1 || true)"
            fi
            if [[ -z "$organization" ]]; then
              organization="$(sed -n 's/^[[:space:]]*sonar\\.organization[[:space:]]*=[[:space:]]*//p' "$props" | head -n 1 || true)"
            fi
          fi

          if [[ -z "$project_key" ]]; then
            project_key="${REPO//\//_}"
          fi
          if [[ -z "$organization" ]]; then
            organization="$VAR_ORG"
          fi
          if [[ -z "$organization" ]]; then
            organization="$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          fi

          {
            echo "project_key=$project_key"
            echo "organization=$organization"
          } >> "$GITHUB_OUTPUT"

      - name: Sonar scan (with local fallback)
        id: sonar
        uses: FelipeFuhr/ffreis-workflows-general/.github/actions/sonar-scan-with-fallback@2a42e71188441922b2b926899d86fcc04fa4d7f0
        with:
          project-base-dir: ${{ inputs.working-directory }}
          project-key: ${{ steps.vars.outputs.project_key }}
          organization: ${{ steps.vars.outputs.organization }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          extra-sonar-args: >
            -Dsonar.sources=.
          notify-role-to-assume: ${{ secrets.CI_NOTIFY_ROLE_ARN }}
