name: Terraform SonarCloud

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing the Terraform configuration to scan"
        type: string
        default: "."
      sonar-project-key:
        description: "SonarCloud project key (defaults to sonar-project.properties or owner_repo)"
        type: string
        default: ""
      sonar-organization:
        description: "SonarCloud organization slug (defaults to sonar-project.properties or repository owner)"
        type: string
        default: ""
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: GitHub-hosted ubuntu-latest.
        required: false
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonar:
    timeout-minutes: 30
    name: SonarCloud
    permissions:
      contents: read
    runs-on: ${{ fromJson(inputs.runner) }}
    if: vars.SONAR_ENABLED != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - name: Resolve Sonar target
        # SonarCloud's free tier only scans PUBLIC repos (private = 403,
        # confirmed live). Private repos route to the self-hosted SonarQube
        # server ffreis-home-infra's `sonarqube` role deploys into the same
        # cluster this job runs on (scale-to-zero — see that role's README).
        # `github.event.repository.visibility` is populated for every
        # trigger type this workflow supports (push/pull_request/dispatch).
        id: target
        run: |
          set -euo pipefail
          if [[ "${{ github.event.repository.visibility }}" == "public" ]]; then
            echo "host_url=https://sonarcloud.io" >> "$GITHUB_OUTPUT"
            echo "is_local=false" >> "$GITHUB_OUTPUT"
          else
            echo "host_url=http://sonarqube.ci.svc.cluster.local:9000" >> "$GITHUB_OUTPUT"
            echo "is_local=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Sonar settings
        id: vars
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          INPUT_PROJECT_KEY: ${{ inputs.sonar-project-key }}
          INPUT_ORG: ${{ inputs.sonar-organization }}
          VAR_ORG: ${{ vars.SONAR_ORGANIZATION }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          IS_LOCAL: ${{ steps.target.outputs.is_local }}
        run: |
          set -euo pipefail

          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "ERROR: SONAR_TOKEN is required. Configure repository secret SONAR_TOKEN." >&2
            exit 1
          fi

          project_key="$INPUT_PROJECT_KEY"
          org="$INPUT_ORG"

          props="${WORKING_DIRECTORY%/}/sonar-project.properties"
          if [[ -f "$props" ]]; then
            if [[ -z "$project_key" ]]; then
              project_key="$(sed -n 's/^[[:space:]]*sonar\\.projectKey[[:space:]]*=[[:space:]]*//p' "$props" | head -n 1 || true)"
            fi
            if [[ -z "$org" ]]; then
              org="$(sed -n 's/^[[:space:]]*sonar\\.organization[[:space:]]*=[[:space:]]*//p' "$props" | head -n 1 || true)"
            fi
          fi

          if [[ -z "$project_key" ]]; then
            project_key="${REPO//\//_}"
          fi
          if [[ -z "$org" ]]; then
            org="$VAR_ORG"
          fi
          if [[ -z "$org" ]]; then
            org="$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          fi

          # "organization" is a SonarCloud multi-tenancy concept — self-hosted
          # SonarQube Community Edition rejects the -Dsonar.organization
          # argument outright, so it must be omitted entirely for local scans
          # rather than passed empty.
          extra_args=""
          if [[ "$IS_LOCAL" != "true" ]]; then
            extra_args="-Dsonar.organization=$org"
          fi

          {
            echo "project_key=$project_key"
            echo "extra_args=$extra_args"
          } >> "$GITHUB_OUTPUT"

      - name: Install kubectl (local SonarQube routing only)
        if: steps.target.outputs.is_local == 'true'
        run: |
          set -euo pipefail
          krel="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSLO "https://dl.k8s.io/release/${krel}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${krel}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Scale up local SonarQube and wait for readiness
        # RBAC for this is the `sonarqube-scaler` Role in ffreis-home-infra's
        # sonarqube role, bound to this runner pod's own `default`
        # ServiceAccount (its token is already mounted by k8s default
        # behavior — nothing extra to configure here) — scoped to get+patch
        # on exactly the one named Deployment `sonarqube`, nothing else.
        if: steps.target.outputs.is_local == 'true'
        run: |
          set -euo pipefail
          kc=(kubectl --server=https://kubernetes.default.svc
              --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              --token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              -n ci)

          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          "${kc[@]}" patch deployment sonarqube --type=merge -p \
            "{\"spec\":{\"replicas\":1},\"metadata\":{\"annotations\":{\"sonarqube.ffreis/last-scaled-up\":\"${now}\"}}}"

          # Cold-boot budget matches ffreis-home-infra's own
          # sonarqube_ready_timeout_seconds default (see that role's
          # defaults/main.yml for the reasoning) — kept in sync manually,
          # both are small homelab-scoped constants.
          echo "waiting for sonarqube to become ready..."
          deadline=$(( $(date +%s) + 360 ))
          until [[ "$("${kc[@]}" get deployment sonarqube -o jsonpath='{.status.readyReplicas}')" == "1" ]]; do
            if [[ $(date +%s) -ge $deadline ]]; then
              echo "::error::sonarqube did not become ready within 360s" >&2
              exit 1
            fi
            sleep 5
          done
          echo "sonarqube ready"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.target.outputs.host_url }}
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: >
            -Dsonar.projectKey=${{ steps.vars.outputs.project_key }}
            ${{ steps.vars.outputs.extra_args }}
            -Dsonar.sources=.
